<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101218"><title>命先欠着 — 沧屿游戏屋</title><meta name="description" content="受伤先记账，五秒内打回来。一个关于追击、抵账和主动结算的横版动作小游戏。"><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header class="mast"><a class="brand" href="#" id="brandHome"><span class="brand-mark">屿</span> 沧屿游戏屋 <span class="slash">/</span> <span class="en">CANGYU PLAYROOM</span></a><span class="version"><i></i> 空战追债 0.3</span></header>
<section class="cabinet" id="cabinet" aria-label="命先欠着游戏"><canvas id="game" width="1280" height="720" tabindex="0" aria-label="横版动作游戏，A D 移动，空格跳跃，J轻击，K重击，Shift闪避，Q结账"></canvas>
<div id="hud" class="hud hidden"><div class="life"><div class="hud-label"><span>现有生命 <b id="hpNum">100</b><small id="maxHp"> / 100</small></span><span id="debtNum">待扣 0</span></div><div class="hpbar"><i id="hpFill"></i><i id="debtFill"></i></div><div class="ledger-line"><span id="debtState">暂时没有欠账</span><span id="timer">—</span></div><div class="timebar"><i id="timerFill"></i></div><div id="skillStatus" class="skill-status">Shift 闪避 · 迎击瞬间可精准抵账</div></div><div class="stage"><span id="chapter">01 / 夜市街口</span><b id="wave">第 1 波</b><small id="goal">清掉眼前的敌人</small><small id="perkStatus" class="perk-status"></small></div><div class="hud-actions"><button id="soundBtn" title="切换声音">声音 开</button><button id="pauseBtn">暂停 <kbd>Esc</kbd></button></div></div>
<div class="urgent hidden" id="urgent"></div><div id="hint" class="hint hidden"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="overlay" class="overlay"></div>
<div id="settleControl" class="settle-control hidden"><button id="settleBtn"><kbd>Q</kbd><span><b>主动结账</b><small id="settleDetail">先挨一拳，才能反击</small></span><em>↗</em></button></div>
<div id="touch" class="touch hidden"><div><button data-hold="left" aria-label="向左">◀</button><button data-hold="right" aria-label="向右">▶</button></div><div><button data-act="jump">跳</button><button data-act="dash">闪</button><button data-act="light">J</button><button data-act="heavy">K</button><button data-act="mark">E</button><button class="touch-q" data-act="settle">Q</button></div></div>
</section><footer class="footer"><span><kbd>A</kbd><kbd>D</kbd> 移动 <i>·</i> <kbd>空格</kbd> 二段跳 <i>·</i> <kbd>J</kbd> 轻击 <kbd>K</kbd> 重击 <i>·</i> <kbd>Shift</kbd> 闪避 <i>·</i> <kbd>E</kbd> 欠条 <i>·</i> <kbd class="red">Q</kbd> 结账</span><button id="helpBtn">操作手册 <kbd>H</kbd></button><button id="fullscreenBtn" title="全屏">全屏 ↗</button></footer><div class="below"><span>挨打先记账。要么打回来，要么认账。</span><span>本机保存进度 · 无需联网 · 推荐键盘游玩</span></div></main><script src="engine.js"></script><script src="game.js"></script></body></html>
